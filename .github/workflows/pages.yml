name: Publish interactive laboratory pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build and validation dependencies
        run: python -m pip install -e '.[test]'
      - name: Numerical and documentation checks
        run: |
          python -m pytest
          python scripts/agent_catalog.py build --check
          python scripts/check_agent_docs.py
      - name: Build static reading and interaction pages
        run: python scripts/build_pages.py
      - name: Validate paths, mathematics runtime and publication contents
        run: python scripts/check_pages.py --report .build/pages/verification.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/pages/site
      - uses: actions/upload-artifact@v4
        with:
          name: pages-validation
          path: .build/pages/verification.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
