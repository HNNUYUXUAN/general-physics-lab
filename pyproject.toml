[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "general-physics-lab"
version = "0.1.0"
description = "Reproducible general physics experiments in Python and Wolfram Language"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSING.md", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "缪雨轩"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pandas>=2.1", "nbformat>=5.9", "nbclient>=0.10", "nbconvert>=7.16", "ipykernel>=6.29", "sympy>=1.12", "markdown>=3.5", "plotly>=6,<8", "beautifulsoup4>=4.12"]

[project.urls]
Homepage = "https://hnnuyuxuan.github.io/general-physics-lab/"
Repository = "https://github.com/HNNUYUXUAN/general-physics-lab"
Documentation = "https://github.com/HNNUYUXUAN/general-physics-lab/blob/main/docs/usage.md"

[project.optional-dependencies]
test = ["pytest>=8", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
