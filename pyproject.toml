[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "general-physics-lab"
version = "0.1.0"
description = "Reproducible general physics experiments in Python and Wolfram Language"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pandas>=2.1", "nbformat>=5.9", "nbclient>=0.10", "nbconvert>=7.16", "ipykernel>=6.29", "sympy>=1.12", "markdown>=3.5", "plotly>=6,<8", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
